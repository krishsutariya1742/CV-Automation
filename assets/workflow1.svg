<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style> .box{fill:#f3f4f6;stroke:#111827;stroke-width:1.5;font:14px/1.2 Arial;} .title{font-weight:700;font-size:16px;} .arrow{fill:none;stroke:#374151;stroke-width:2;marker-end:url(#a);} </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
  </defs>
  <rect x="20" y="20" width="160" height="40" rx="6" class="box"/>
  <text x="100" y="45" text-anchor="middle">Outlook: New Email</text>

