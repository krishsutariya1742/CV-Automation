<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <style> .box{fill:#f9fafb;stroke:#0f172a;stroke-width:1.2;font:14px/1.2 Arial;} .title{font-weight:700;font-size:15px;} .arrow{fill:none;stroke:#0f172a;stroke-width:2;marker-end:url(#a);} </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/></marker>
  </defs>
  <rect x="20" y="20" width="220" height="44" rx="8" class="box"/>
  <text x="130" y="50" text-anchor="middle" class="title">Trigger: New Job Opening (Airtable)</text>

  <rect x="270" y="20" width="160" height="44" rx="6" class="box"/>
  <text x="350" y="50" text-anchor="middle">Confirm Status: Open</text>

  <rect x="470" y="20" width="260" height="44" rx="8" class="box"/>
  <text x="600" y="50" text-anchor="middle">Retrieve Candidates (Airtable)</text>

  <rect x="200" y="100" width="400" height="64" rx="10" class="box"/>
  <text x="400" y="130" text-anchor="middle" class="title">Claude AI: Re-evaluate Candidates</text>
  <text x="400" y="150" text-anchor="middle">Updated score, status, recommendation</text>

  <rect x="120" y="200" width="220" height="40" rx="6" class="box"/>
  <text x="230" y="225" text-anchor="middle">Create Shortlisted Records</text>

  <rect x="420" y="200" width="220" height="40" rx="6" class="box"/>
  <text x="530" y="225" text-anchor="middle">Create Interviewed Records</text>

  <rect x="270" y="260" width="260" height="40" rx="6" class="box"/>
  <text x="400" y="285" text-anchor="middle">Filter ≥80 & Send HR Report</text>

  <path d="M240 42 L270 42" class="arrow"/>
  <path d="M430 42 L470 42" class="arrow"/>
  <path d="M600 84 L400 100" class="arrow"/>
  <path d="M400 164 L300 200" class="arrow"/>
  <path d="M500 164 L600 200" class="arrow"/>
  <path d="M400 236 L400 260" class="arrow"/>
</svg>