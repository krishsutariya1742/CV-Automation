<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style> .box{fill:#ffffff;stroke:#0b1220;stroke-width:1.2;font:14px/1.2 Arial;} .title{font-weight:700;font-size:15px;} .arrow{fill:none;stroke:#0b1220;stroke-width:2;marker-end:url(#a);} </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1220"/></marker>
  </defs>
  <rect x="20" y="20" width="240" height="44" rx="8" class="box"/>
  <text x="140" y="50" text-anchor="middle" class="title">Get Job Openings (Airtable)</text>

  <rect x="300" y="20" width="280" height="44" rx="8" class="box"/>
  <text x="440" y="50" text-anchor="middle">Loop: For each job, fetch shortlisted candidates</text>

  <rect x="120" y="110" width="200" height="44" rx="8" class="box"/>
  <text x="220" y="140" text-anchor="middle">Sort by AI Score</text>

  <rect x="340" y="110" width="240" height="44" rx="8" class="box"/>
  <text x="460" y="140" text-anchor="middle">Select Top 5 Candidates</text>

  <rect x="220" y="200" width="280" height="44" rx="8" class="box"/>
  <text x="360" y="230" text-anchor="middle">Send Job-wise Candidate Report to HR</text>

  <path d="M260 42 L300 42" class="arrow"/>
  <path d="M460 42 L460 110" class="arrow"/>
  <path d="M220 154 L220 200" class="arrow"/>
  <path d="M400 154 L400 200" class="arrow"/>
</svg>